<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>5.2 五止・觀人寂怕絕欲止｜修華嚴奧旨妄盡還源觀</title><meta name="description" content="華嚴宗《修華嚴奧旨妄盡還源觀》互動課本"><link rel="stylesheet" href="/huanyuan/_astro/Base.Byg980h6.css"></head><body><header class="site-header"><div class="container"><a class="site-title" href="/huanyuan">妄盡還源觀</a><nav class="site-nav"><a href="/huanyuan">總綱</a><a href="/huanyuan/dict">名相</a><a href="/huanyuan/about">說明</a></nav></div></header><main><div class="container"><header class="read-head"><p class="read-part">五入五止・5.2</p><h1 class="read-title">五止・觀人寂怕絕欲止</h1><p class="read-lb-range">T45n1876 T.639b18–T.639b20</p></header><div class="sutra-text"><p class="sutra-line"><span class="txt">二者、觀人寂怕</span><span class="lb">T.639b18</span></p><p class="sutra-line"><span class="txt">絕欲止。謂五蘊無主名曰寂怕，空寂無求名</span><span class="lb">T.639b19</span></p><p class="sutra-line"><span class="txt">為絕欲。故云觀人寂怕絕欲止也。</span><span class="lb">T.639b20</span></p></div><section class="tabs"><div class="tab-bar" role="tablist"><button role="tab" aria-selected="true" data-tab="baihua">白話</button><button role="tab" aria-selected="false" data-tab="tifo">體佛法師</button><button role="tab" aria-selected="false" data-tab="jingkong">淨空法師</button><button role="tab" aria-selected="false" data-tab="mengcan">夢參法師</button></div><div class="tab-panel" data-panel="baihua" role="tabpanel"><p class="placeholder">整理中，敬請期待</p></div><div class="tab-panel" data-panel="tifo" role="tabpanel" hidden><p class="placeholder">整理中，敬請期待</p></div><div class="tab-panel" data-panel="jingkong" role="tabpanel" hidden><p class="placeholder">整理中，敬請期待</p></div><div class="tab-panel" data-panel="mengcan" role="tabpanel" hidden><p class="placeholder">整理中，敬請期待</p></div></section><div style="margin-top: 2.5rem; text-align: center;"><button class="btn-read" data-read-toggle aria-pressed="false">標記已讀</button><script>(function(){const id = "5.2";

  const btn = document.querySelector('[data-read-toggle]');

  function load() {

      const v = JSON.parse(localStorage.getItem(KEY) ?? '[]');
      return Array.isArray(v) ? v : [];
